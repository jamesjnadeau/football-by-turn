<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football By Turn</title>
  <style>
    html, body { height: 100%; }
    /* The board owns the viewport; the menu floats above it. */
    body { font-family: system-ui, sans-serif; margin: 0; overflow: hidden; }
    #board { display: block; width: 100vw; height: 100%; touch-action: none; }
    /* Author `#board{display:block}` above would otherwise beat the UA [hidden]
       rule — the same trap the menu buttons below carry a note about. The board
       is hidden until a game is picked off the home screen. */
    #board[hidden] { display: none; }
    /* The column is fixed pixels over a board that letterboxes, so the board
       has to hand it the room rather than trust the letterboxing to leave it.
       At 720 wide the right sideline landed at 626.7 and the column started at
       616 — four field units of playing surface, and every right-hand yard
       number, under a bar that carries the save button and all five play
       buttons. The column is 6rem of buttons and .5rem of margin, so 7rem
       gives it a strip of its own with half a rem of daylight, and the board
       letterboxes inside what is left at every width above the breakpoint.
       Raising the breakpoint instead would have left the yard numbers covered
       at 1280, where the field itself is already clear. */
    @media (min-width: 701px) { #board { width: calc(100vw - 7rem); } }

    /* The controls used to be SVG plates drawn in field units, which welded
       their size to the board's scale: on a phone a plate came out about
       12.5px against the 44 a thumb needs. They are real buttons now, sized in
       rem, so the reader's own text size decides how big they are and the
       board's scale has nothing to do with it. */
    #controls {
      position: fixed; display: flex; gap: .5rem;
      top: 50%; right: .5rem; transform: translateY(-50%);
      flex-direction: row; align-items: center;
    }
    #controls[hidden] { display: none; }
    .control-group { display: flex; flex-direction: column; gap: .5rem; }
    .control {
      min-width: 2.75rem; min-height: 2.75rem;
      display: flex; align-items: center; justify-content: center;
      font: inherit; font-size: 1.25rem; line-height: 1; cursor: pointer;
      background: #fff; border: 1px solid #1a7f37; border-radius: .35rem;
    }
    /* Author `.control{display:flex}` above would otherwise beat the UA
       [hidden] rule, the same trap #board and the menu's buttons above each
       carry their own note about. app/controls.js hides a dropped control by
       setting this attribute, not by removing the node, so without this rule
       every hidden control would still take its flex slot in the column. */
    .control[hidden] { display: none; }
    .control[aria-pressed="true"] { background: #d7ebdc; border-width: 2px; }
    .control:disabled { border-color: #ccc; opacity: .4; cursor: default; }
    /* The tutorial's ring. A player is ringed in SVG because a player is on the
       field; a control is ringed here, because a control is not. */
    .control.is-ringed { outline: 3px solid #c9962c; outline-offset: 2px; }
    /* The toggle only exists for the phone layout below, so it stays out of
       the desktop column entirely rather than merely being sized to nothing. */
    #playbook-toggle { display: none; }
    /* Author `display` above and `display: flex` below would otherwise beat
       the UA [hidden] rule the moment either wins on specificity — the same
       trap #board, the menu's buttons and .control above each carry their own
       note about. The toggle is marked `hidden` in the markup until
       app/controls.js's mountControls() clears it, so without this rule a
       page that has loaded its styles but not yet run its script would show
       an inert toggle on a narrow screen. */
    #playbook-toggle[hidden] { display: none; }

    /* On a narrow screen the right-hand column would cost 23% of the width, so
       the controls go to the bottom instead — the thumb zone — and the playbook
       moves behind a toggle rather than sitting where a thumb rests, since a
       stray press on it replaces the whole formation with no undo. */
    @media (max-width: 700px) {
      #playbook-toggle { display: flex; }
      /* The bar stands at the foot of the flow and the board takes whatever
         height is left, rather than the bar floating over a board that
         reserved a flat 3.75rem for it. The flat figure was only ever right
         for a bar of exactly one row, and the row below is now allowed to
         wrap; letting the column do the arithmetic means the reservation
         follows the bar wherever it goes, with nothing measuring anything at
         run time. It also closes the 3px of dead band the fixed figure left
         between the two at 375x812. */
      body { display: flex; flex-direction: column; }
      #board { flex: 1 1 0; height: auto; min-height: 0; }
      #controls {
        position: relative; inset: auto; transform: none;
        flex-direction: column; align-items: stretch; gap: 0;
        background: #fff; border-top: 1px solid #ccc;
      }
      /* Seven 2.75rem targets and their spacing do not fit 375px once the
         reader's text is much above the default: at a 20px root the row wanted
         452px, and ⏩ Run Turn — the primary action of the whole game — began
         22px past the right edge of a window that does not scroll. The buttons
         keep their size, since their size is the entire reason this bar exists
         at all, and the row wraps instead. `space-evenly` is what actually
         separates them, so the column gap is zero and every pixel of width
         goes to fitting one more button on the line; the row gap shows only
         once a line has genuinely run out. A wrapped bar costs another 2.75rem
         of field, but only on the screens and text sizes that had no room to
         give in the first place.
         The toggle rides inside the game row rather than under it, so the bar
         is one row of seven — six game controls and the way to the playbook —
         wherever seven still fit. It leads the row rather than closing it
         because it is the group's first child in the markup and
         mountControls() appends the six after it: an `order` that moved it to
         the right would leave the first thing a keyboard reaches the last
         thing an eye reaches, and one button's tidiness is not worth that. */
      #controls .control-group {
        flex-direction: row; justify-content: space-evenly;
        flex-wrap: wrap; gap: .375rem 0; padding: .375rem;
      }
      /* The sheet is drawn over the field rather than standing in the flow
         beneath it, and is closed until the toggle opens it. A coach opens the
         playbook with his arrows already on the board, and a sheet that took
         its room out of the flow would rescale the field under his finger; a
         drawer only covers it, and only for as long as it is open. Its own
         background and border-top are what the fixed bar used to lend it. */
      #controls [data-group="playbook"] {
        position: absolute; left: 0; right: 0; bottom: 100%;
        background: #fff; border-top: 1px solid #ccc;
      }
      #controls:not(.playbook-open) [data-group="playbook"] { display: none; }
    }

    /* The home screen owns the whole viewport until a game starts, and gets it
       back when one is left. It is empty in the markup: app/home.js writes the
       heading and the buttons in from lib/game/home.js. */
    #home {
      position: fixed; inset: 0; box-sizing: border-box; padding: 1.5rem;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: .75rem; text-align: center; background: #fff;
    }
    #home[hidden] { display: none; }
    #home h1 { font-size: 2rem; margin: 0; }
    .home-blurb { margin: 0 0 .5rem; max-width: 26rem; color: #454545; }
    .home-choices { display: flex; flex-direction: column; gap: .75rem; width: 16rem; }
    .home-choice {
      display: block; width: 100%; padding: .75rem; font: inherit; cursor: pointer;
      border: 2px solid #1a7f37; border-radius: .5rem; background: #1a7f37; color: #fff;
    }
    /* The game that is not built yet reads as a promise rather than a control:
       no fill, no green, and no pointer that suggests it will do something. */
    .home-choice:disabled {
      background: #fff; color: #666; border-color: #ccc; cursor: default;
    }
    /* The tutorial is an offer, not the thing you came for: outlined rather
       than filled, so it reads as secondary without reading as unavailable
       the way the disabled rule above does. */
    .home-choice-quiet {
      background: #fff; color: #1a7f37; border-color: #1a7f37;
    }
    .home-choice-label { display: block; font-size: 1.1rem; font-weight: 600; }
    .home-choice-note { display: block; font-size: .85rem; opacity: .85; margin-top: .25rem; }

    /* Padding lives on .menu-body, not the dialog, so a click landing on the
       dialog element itself is unambiguously a backdrop click. */
    #menu { padding: 0; border: 1px solid #999; border-radius: .5rem; }
    #menu::backdrop { background: rgba(0, 0, 0, .45); }
    .menu-body { width: 16rem; padding: 1rem; }
    .menu-body h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    #hud { margin-bottom: .5rem; }
    .menu-body button { display: block; width: 100%; margin: .25rem 0; padding: .5rem; }
    .menu-body button[hidden] { display: none; } /* author `button{display:block}` above would otherwise beat the UA [hidden] rule */
    .menu-body h2 { font-size: 1rem; margin: 1rem 0 .25rem; }
    .play-slot { font-size: .9rem; }
    #close-menu { margin-top: .75rem; }
  </style>
</head>
<body>
  <section id="home"></section>
  <svg id="board" xmlns="http://www.w3.org/2000/svg" hidden></svg>
  <div id="controls" hidden>
    <div class="control-group" data-group="game">
      <button id="playbook-toggle" class="control" type="button" hidden></button>
    </div>
    <div class="control-group" data-group="playbook"></div>
  </div>
  <dialog id="menu">
    <div class="menu-body">
      <h1>📋 Coaches Menu</h1>
      <div id="hud"></div>
      <button id="run">Run Turn</button>
      <button id="clear">Clear Arrows</button>
      <button id="autoplan-offense">Autoplan</button>
      <button id="ai">Defense: computer (smart)</button>
      <button id="reposition">Reposition: off</button>
      <button id="personnel">Personnel: stacked</button>
      <button id="debug">Velocity lines: off</button>
      <button id="next" hidden>Next Down</button>
      <button id="new">New Game</button>
      <button id="home-btn">Back to Home</button>
      <h2 id="plays-heading">Plays</h2>
      <button id="save-play">Save current play</button>
      <div id="play-slots"></div>
      <div id="debug-tools" hidden>
        <h2>Coaching log</h2>
        <button id="copy-log">Copy coaching log</button>
        <button id="clear-log">Forget my tendencies</button>
        <h2>In-browser training</h2>
        <button id="train">Train vs. my log</button>
        <button id="copy-genome">Copy trained genome</button>
        <button id="discard-genome">Use the shipped genome</button>
      </div>
      <button id="close-menu">Close</button>
    </div>
  </dialog>
  <script type="module" src="app/home.js"></script>
</body>
</html>
